# pre-commit 훅 설정 — 시크릿 유출 3중 가드 Layer 1
# Pre-commit hook config — Secret leak prevention Layer 1
#
# 설치 / Install:
#   py -3 -m pip install pre-commit
#   git config --unset-all core.hooksPath   # 🔴 설정돼 있으면 pre-commit 이 설치를 거부한다
#   py -3 -m pre_commit install             # 아래 default_install_hook_types 로 2 타입 동시 설치
#
# 🔴 `pre-push` 는 설치하지 **않는다** — `.git/hooks/pre-push` 에 이 리포의 6-step ② 게이트
#    러너가 이미 있고, pre-commit 은 남의 훅을 `pre-push.legacy` 로 **밀어낸다**(파괴적).
# 🔴 Never install the pre-push type: pre-commit would displace this repo's own push gate.
#
# 🔴 `pre-commit` 실행파일이 PATH 에 없어도 훅은 동작한다 — 생성된 훅이 절대 인터프리터
#    경로(INSTALL_PYTHON)를 박아 넣기 때문이다. PATH 부재를 '미설치' 로 읽지 말 것.

# 🔴 `pre-commit install` 이 **두 타입을 함께** 설치하게 한다 (backlog R56).
#    이전에는 `--hook-type commit-msg` 를 따로 쳐야 했고, 그것을 빠뜨리면
#    `check-commit-msg-secrets`(실제 토큰 유출 사고로 만들어진 훅)만 조용히 죽은 채
#    나머지가 설치돼 "설치 완료" 로 보였다.
# Install both hook types by default: forgetting the commit-msg type silently killed the
# very hook that a real token-leak incident created.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  # Layer 1-A: gitleaks — 코드 diff + 커밋 메시지 시크릿 탐지
  # Layer 1-A: gitleaks — detects secrets in code diff AND commit messages
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: "🔐 gitleaks: 시크릿 패턴 스캔 (코드)"
        description: Detect hardcoded secrets in staged files

  # Layer 1-B: 커밋 메시지 본문 토큰 패턴 차단 (이번 사고 유형)
  # Layer 1-B: Block token patterns in commit message body (this incident type)
  - repo: local
    hooks:
      - id: check-commit-msg-secrets
        name: "🔐 커밋 메시지 시크릿 패턴 차단"
        language: pygrep
        entry: "[0-9]{8,12}:[A-Za-z0-9_-]{35,}"
        args: ["--multiline"]
        stages: [commit-msg]
        description: |
          Telegram Bot Token 형식이 커밋 메시지에 포함되면 차단.
          실제 값 대신 <REDACTED> 또는 *** 사용.

      - id: check-env-not-staged
        name: "🔐 .env 파일 커밋 차단"
        language: pygrep
        entry: "."
        files: "^\\.env$"
        stages: [pre-commit]
        description: .env 파일이 staged되면 커밋 차단.

      - id: check-secrets-in-diff
        name: "🔐 diff 내 주요 시크릿 패턴 차단"
        language: pygrep
        entry: "(?<![A-Za-z0-9_])(TELEGRAM_BOT_TOKEN|ANTHROPIC_API_KEY|GITHUB_CLIENT_SECRET|SESSION_SECRET|TOKEN_ENCRYPTION_KEY)\\s*=\\s*['\"]?[^${'\"\\s]{10,}"
        exclude: "^(README\\.md|README\\.ko\\.md|docs/|tests/|e2e/|\\.env\\.example)"
        stages: [pre-commit]
        description: |
          환경변수에 실제 값이 하드코딩된 경우 차단.
          os.getenv() 또는 os.environ 참조 방식만 허용.
          README/docs 는 문서 예시값 허용을 위해 제외.
          .env.example 제외 사유: placeholder 문서 파일 (README 동일 사유 — 2026-06-10,
          기존 placeholder 줄 your-telegram-bot-token/dev-secret-change-in-production 오탐.
          placeholder 를 빈 값/${...} 로 바꾸는 대안은 SESSION_SECRET 32자 validator 가
          `cp .env.example .env` dev flow 를 깨뜨려 기각. 실제 .env 는 Layer 1-B
          check-env-not-staged 훅이 staged 자체를 차단하고, gitleaks(Layer 1-A)와
          CI TruffleHog 는 .env.example 도 계속 스캔한다).
          tests/e2e 제외 사유: Python os.environ["KEY"] = "value" 형식은 값 앞뒤 따옴표로 인해
          패턴 [^${'"\s]{10,} 이 매칭되지 않아 실질적 탐지 불필요.
          단, .env 스타일 KEY=value (따옴표 없음) 형식은 매칭되므로 forward-looking 보호로 제외 유지.
          word-boundary 음수 lookbehind `(?<![A-Za-z0-9_])`: 상수 이름이 env 키를 접미사로 포함하는
          오탐 차단 (예: src/main.py `_DEFAULT_SESSION_SECRET = "dev-secret-change-in-production"` 의
          부분문자열 `SESSION_SECRET = "..."`). 실제 `SESSION_SECRET = "값"` 등 standalone 할당은 계속 탐지
          (2026-06-18 — 정규식 정밀도 향상, 탐지 약화 아님).

      # Layer 1-D: docs/repo 정합 가드 (stdlib 스크립트 — 회고 WF-2/3/5, 2026-06-23)
      # Layer 1-D: docs/repo integrity guards (stdlib scripts — retro WF-2/3/5)
      # 모두 repo 내부만 읽고(또는 부재 시 skip) pass_filenames:false 로 스크립트가 자체 스캔.
      # 🔴 `language: python` 이지 `system` 이 아니다 (backlog R56 · 실행 실측 2026-08-06).
      #   `system` 은 PATH 를 손대지 않으므로 `entry: python …` 이 **주변 PATH 의 python**
      #   으로 해소된다. 이 개발 머신에서 그것은 Microsoft Store 스텁이라 스크립트를 실행하지
      #   않고 `Python` 한 줄만 찍고 죽는다 — 실측: `system` → **Failed, exit 9009**,
      #   `python` → **Passed**. 즉 설치만 했다면 문서·가드 훅 7종이 커밋마다 무의미하게
      #   차단했을 것이다. `language: python` 은 pre-commit 이 만든 venv 의 bin 을 PATH 앞에
      #   붙이므로 `python` 이 실제 인터프리터로 해소된다(의존성은 여전히 0 — stdlib only).
      # Must be `python`, not `system`: `system` leaves PATH alone, so `entry: python …`
      # resolves to the Windows Store stub here (exit 9009). Measured both ways.
      - id: check-docs-sync
        name: "📊 docs 수치 정합 (STATE↔README 배지 + 의존성 핀)"
        language: python
        entry: python scripts/check_docs_sync.py
        # 🔴 files 는 스크립트가 **읽는 모든 파일**을 덮어야 한다 — 좁으면 그 파일만 바꾼 커밋에서
        # 훅이 아예 발화하지 않는다(Grok claim-review 019fccd5 적발: 핀 축 신설 후 requirements.txt·
        # deploy.md 가 빠져 있었다). 회귀 가드 = test_repo_integrity_checks.py 의 배선 테스트.
        # files must cover every input the script reads; a narrow pattern silently skips the hook.
        files: "^(docs/STATE\\.md|README\\.md|README\\.ko\\.md|requirements\\.txt|\\.claude/rules/deploy\\.md)$"
        pass_filenames: false
        stages: [pre-commit]
        description: STATE 종합·추적셀 ↔ README/README.ko Tests 배지 카운트 일치 + requirements.txt 실핀 ↔ deploy.md 인용·FastAPI 배지 일치 검사.

      - id: check-toc-anchors
        name: "🔗 TOC 앵커 정합"
        language: python
        entry: python scripts/check_toc_anchors.py
        files: "^(CONTRIBUTING\\.ko\\.md|docs/runbooks/github-integration-guide\\.md|docs/runbooks/onpremise-migration-guide\\.md)$"
        pass_filenames: false
        stages: [pre-commit]
        description: 활성 `## 목차` 문서의 `](#...)` 앵커가 헤딩 GitHub slug(중복 -1, em-dash 더블하이픈)과 일치하는지 검사 (과거 #958 끊긴 앵커 차단).

      - id: check-memory-refs
        name: "🧠 메모리 슬러그 참조 정합"
        language: python
        entry: python scripts/check_memory_refs.py
        files: "^(CLAUDE\\.md|\\.claude/policies/.*\\.md)$"
        pass_filenames: false
        stages: [pre-commit]
        description: CLAUDE.md/policies 의 메모리 슬러그 참조 ↔ 실제 메모리 파일 정합 (메모리 dir 부재 시 skip — CI/타 환경 안전).

      - id: check-guard-fail-open
        name: "🛡️ 가드 fail-open floor (bare-substring 판정 차단, B8)"
        language: python
        entry: python scripts/check_guard_fail_open.py
        files: "^scripts/check_.*\\.py$"
        pass_filenames: false
        stages: [pre-commit]
        description: 파일 읽어 판정하는 check 가드가 구조 도구(ast/re/subprocess) 없이 bare substring 만 쓰면 fail-open 으로 차단 (Grok 최종 검증 B8, floor). escape = # fail-open-reviewed.

      - id: check-architecture-tree-sync
        name: "🌲 architecture 트리 싱크 (src/ ↔ architecture.md)"
        language: python
        entry: python scripts/check_architecture_tree_sync.py
        files: "^(src/[^/]+/|src/[^/]+\\.py|docs/architecture\\.md)$"
        pass_filenames: false
        stages: [pre-commit]
        description: src/ 패키지·최상위 모듈 ↔ architecture.md 트리 등재 정합 (신규 파일 미등재 3회 재발 차단, 진단 P1).

      - id: check-env-vars-sync
        name: "🔑 env-vars 싱크 (config.py ↔ env-vars.md)"
        language: python
        entry: python scripts/check_env_vars_sync.py
        files: "^(src/config\\.py|docs/reference/env-vars\\.md)$"
        pass_filenames: false
        stages: [pre-commit]
        description: config.py Settings env 필드 ↔ env-vars.md 등재 정합 (사이클 82/119 누락 차단).

      - id: check-config-5way-sync
        name: "🧩 config 싱크 — RepoConfig 3-layer (ORM↔Data↔Update)"
        language: python
        entry: python scripts/check_config_5way_sync.py
        files: "^(src/models/repo_config\\.py|src/config_manager/manager\\.py|src/api/repos\\.py)$"
        pass_filenames: false
        stages: [pre-commit]
        description: "RepoConfig 3-layer(Python: ORM↔Data↔Update) 필드 정합. 폼/PRESETS 2-layer 는 HTML/JS 파싱 fragile 로 범위 외(수동 검토 — design 2026-06-23)."

      # 🔴 2026-07-29 훅 해제 (사용자 결정 · Grok 전반 검토) — 스크립트는 남기고 **차단만** 해제.
      #   근거: 이 훅은 커밋을 막는 유일한 **스타일** 규칙이었고, 다른 모든 pre-commit 훅과 달리
      #   구체적 제품 결함 사례를 인용하지 않는다(사고 기반이 아님). 커밋 마찰 대비 품질 기여가
      #   불분명하다는 것이 검토 결론.
      # 🔴 **CLAUDE.md 의 이중언어 주석 원칙은 그대로 유효하다** — 사용자가 명시한 작성 규칙이며,
      #   해제된 것은 기계 차단뿐이다. 수동 점검은 `python scripts/check_bilingual_comments.py`.
      # 🔴 Hook disabled 2026-07-29 (user decision): the script stays, only the blocking is removed.
      #   It was the sole *style* rule able to fail a commit and, unlike every other hook here, cites
      #   no concrete product defect. The CLAUDE.md bilingual-comment principle itself still stands.
      # - id: check-bilingual-comments
      #     entry: python scripts/check_bilingual_comments.py  ·  files: "^src/.*\\.py$"

  # Layer 1-C: 기본 코드 품질 훅
  # Layer 1-C: Basic code quality hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # 🔴 자동 수정 훅은 **vendor·수정금지 파일**을 건드리면 안 된다.
      #   `alembic/versions/**` 는 CLAUDE.md 수정 금지 파일 · `src/static/vendor/**` 는
      #   외부 산출물이다.
      # Autofixers must not rewrite vendored assets or edit-forbidden files.
      - id: trailing-whitespace
        exclude: "^(alembic/versions/|src/static/vendor/)"
      - id: end-of-file-fixer
        exclude: "^(alembic/versions/|src/static/vendor/)"
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key
        name: "🔐 SSH/PEM 개인키 탐지"
