[pytest]
pythonpath = ..
# asyncio_mode 는 의도적으로 생략 — E2E 서버는 asyncio.new_event_loop()로 별도 관리
# asyncio_mode=auto 를 추가하면 단위 테스트와 이벤트 루프 충돌 발생 (CLAUDE.md 참조)
markers =
    perf: performance measurement tests — run via `make test-perf`
    # `e2e` 는 실제로 쓰이는데 등재돼 있지 않아 PytestUnknownMarkWarning 10건이 났다
    # (test_overview_score 5 + test_repos_mode 5). `--strict-markers` 를 켜면 그 10건은
    # 즉시 collection error 가 된다 — 등재로 봉인 (R52 완전성 비평 C-5).
    # The `e2e` marker was used but unregistered, producing 10 warnings that would become
    # collection errors under --strict-markers.
    e2e: end-to-end browser tests
