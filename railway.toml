# 빌드 정본 = 루트 Dockerfile(분석기 설치·핀 포함). Railway 는 이 파일을 2026-12-01 부터 읽지 않는다.
# The build lives in the root Dockerfile; Railway stops reading this file on 2026-12-01.
[build]
builder = "DOCKERFILE"

[deploy]
# 🔴 셸 래핑 필수 — Dockerfile 빌드의 시작 명령은 exec 형이라 `$PORT` 를 확장하지 않는다.
#   이 키를 빼면 대시보드의 래핑 안 된 Start Command 가 적용돼 기동이 깨진다(이미지 CMD 와 같은 명령).
# Must be shell-wrapped: Dockerfile start commands run in exec form and never expand $PORT.
startCommand = '/bin/sh -c "exec uvicorn src.main:app --host 0.0.0.0 --port $PORT --proxy-headers"'
# Pre-deploy: 새 컨테이너가 트래픽 받기 전 DB 마이그레이션 실행 (loud-fail — 실패 시 배포 중단).
#   main.py lifespan 도 alembic upgrade head 를 돌리나 (30s 타임아웃·broad-except = silent-fail),
#   pre-deploy 는 실패 시 배포를 중단해 schema drift(0038 고착 같은)를 즉시 가시화한다. 양쪽 멱등 = 중복 무해.
# Run DB migrations before the new container takes traffic (loud-fail: a failed migration aborts the deploy).
#   The lifespan also runs `alembic upgrade head` (30s timeout + broad-except = silent-fail); the pre-deploy
#   surfaces schema drift loudly. Both are idempotent (alembic stamps the head), so the overlap is harmless.
# 🔴 대시보드 Pre-deploy Command 는 **같은 값**(`alembic upgrade head`)으로 둔다 — 2026-12-01 뒤에는
#   이 파일이 읽히지 않아 대시보드가 유일한 출처가 된다. 비우면 그때 마이그레이션 게이트가 사라진다.
#   전례 2026-06-15: 대시보드의 stale `npm run migrate` 가 적용돼 0038 에서 고착됐다 — 값은 항상 같게.
# 🔴 Keep the dashboard Pre-deploy Command identical: after 2026-12-01 it is the only source.
preDeployCommand = "alembic upgrade head"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# 🔴 Railway cron 은 여기서 설정할 수 없다 (2026-07-19 P0 — 5종 전부 미실행 사고).
#   `[[deploy.cronJobs]]` 는 **Railway 스키마에 존재하지 않는 키**라 조용히 무시된다.
#   Railway cron 은 서비스당 **단일** `deploy.cronSchedule`(또는 대시보드 Cron Schedule)이며
#   배열을 지원하지 않는다. 게다가 cron 서비스는 start command 를 대신 실행하므로
#   `curl http://localhost:$PORT` 로 자기 웹서버를 부르는 구조 자체가 성립하지 않는다.
#   실측: SCAManager `cronSchedule=null`·`nextCronRunAt=null` → weekly/trend/retry/orphan/
#   retention 5종이 **한 번도 실행되지 않았다**(20:00 UTC 스윕 3.5h 경과 후 만료 캐시 8건 잔존).
# ✅ 대체 = **인앱 스케줄러** `src/scheduler.py` (lifespan 기동, 운영 전용, 5종 job 등록).
#   배선은 `tests/unit/test_scheduler.py` 가 단언한다 — 저장소 밖 설정이 조용히 어긋나던
#   실패 모드를 코드로 옮긴 것이 이 사고의 교훈이다.
# 🔴 Railway cron cannot be configured here: `[[deploy.cronJobs]]` is not a Railway key and was
#   silently ignored; all 5 jobs never ran. Replaced by the in-app scheduler (src/scheduler.py),
#   whose wiring is asserted by tests instead of living in invisible platform config.

# Fallback B (Railway native cron 제한 시): cron-job.org 외부 → curl
# Fallback B (if Railway native cron is unavailable): use cron-job.org with:
#   POST https://<APP_BASE_URL>/api/internal/cron/weekly   (Header: X-API-Key: $INTERNAL_CRON_API_KEY)
#   POST https://<APP_BASE_URL>/api/internal/cron/trend    (Header: X-API-Key: $INTERNAL_CRON_API_KEY)

# ── replica 핀 (인앱 스케줄러 단일 인스턴스 전제) ─────────────────────────
# 🔴 TOML 테이블 섹션은 **뒤따르는 key=value 를 흡수**하므로 파일 맨 끝에 둔다.
#   [deploy] 중간에 넣으면 그 아래 restartPolicyMaxRetries 가 이 블록으로 빨려 들어간다(실측).
#   TOML sections absorb following keys — keep this last so [deploy] keys stay in [deploy].
#
# 🔴 인앱 스케줄러는 단일 인스턴스 전제다 (src/scheduler.py docstring §한계).
#   replica ≥ 2 면 weekly 리포트가 **중복 발송**되고 GHAS 폴링이 쿼터를 2배 소모한다
#   (retry 큐는 FOR UPDATE SKIP LOCKED, sweep/retention 은 멱등이라 안전).
#   그 전제가 대시보드에만 있으면 스케일업이 조용히 깨뜨리므로 여기 핀한다.
#
# 🔴 `[deploy] numReplicas = 1` 로 쓰면 안 된다 — Railway config-as-code 레퍼런스의
#   `[deploy]` 유효 키가 **아니라 조용히 무시**되고 "핀했다"는 거짓 흔적만 남는다
#   (= `[[deploy.cronJobs]]` 가 cron 5종을 미실행으로 둔 위 P0 와 동형).
#   replica 는 `multiRegionConfig.<region>.numReplicas` 로만 지정된다.
#
# 🔴 region `us-east4-eqdc4a` = **현재 운영 실측값** (railway status --json 의 적용된
#   serviceManifest). 따라서 이 핀은 배포를 이동시키지 않고 현 상태를 코드로 고정만 한다.
#   `numReplicas` is not a valid top-level [deploy] key (silently ignored); the region below is
#   the measured live value, so this pin does not relocate the service.
#
# 가드: tests/unit/scripts/test_railway_scaling_guard.py
#   (무효 키 차단 + multiRegionConfig 총 replica ≥ 2 시 advisory lock 강제)
[deploy.multiRegionConfig.us-east4-eqdc4a]
numReplicas = 1
