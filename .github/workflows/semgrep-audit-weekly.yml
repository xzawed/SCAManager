name: semgrep venv 감사 (주간)

# requirements-semgrep.txt 를 바꾸지 않은 PR · main push 에서는 semgrep 감사가 경고만 남긴다(scripts/semgrep_audit.py).
# 그 사이에 뜬 새 권고를 이 예약 실행이 이슈로 알린다(회고 원장 L09 P2-54 · 사용자 11-16 결정 — 알림 = 이슈).
# 🔴 실행은 늘 초록으로 끝낸다 — 실패하면 main 최신 커밋에 ❌ 가 붙고, Railway 가 CI 를 기다리는 배포와 겹치면
#    그 배포를 SKIP 한다. 알림 자체를 못 했을 때(이슈 목록 · 작성 실패)만 red 다.
# Weekly audit of semgrep's own venv; findings are reported through an issue and the run itself stays green.
on:
  schedule:
    # 월 03:23 UTC(12:23 KST) — 배포가 몰리는 저녁(KST)을 피한다 / avoids the evening deploy window
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: semgrep venv 감사 (주간)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: "pip install --only-binary=:all: pip-audit==2.10.1"

      # 감사 실패도 이 스텝은 초록 — 결과(rc)를 다음 스텝에 넘긴다 / the step passes; rc goes to the next step
      - name: Audit semgrep's own venv requirements
        id: audit
        run: |
          set +e
          python scripts/semgrep_audit.py --always-block --report "$RUNNER_TEMP/semgrep-audit.txt"
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      # rc 가 비어 있어도(감사 스텝 중단) 알린다 — 그때 본문은 «감사 출력이 없다» / an empty rc also notifies
      - name: 이슈로 알림 — 예외 밖 권고 · 감사 실패
        if: steps.audit.outputs.rc != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/semgrep_audit.py --notify "$RUNNER_TEMP/semgrep-audit.txt"
