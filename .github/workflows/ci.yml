name: CI

on:
  push:
    branches: [main]
  # 🔴 base 필터를 두지 않는다 (#1432). `branches: [main]` 이던 시절, base 를 다른 feature
  # 브랜치로 잡은 PR 은 워크플로가 **발화조차 하지 않아** CI 0건으로 머지됐다 — 2026-08-17
  # 실측으로 #1389·#1398·#1399·#1402 4건이 "no checks reported" 상태로 들어갔다.
  # ⚠️ 이것은 **관측**만 되살린다. 머지를 막는 branch protection·ruleset 은 `refs/heads/main`
  # 만 대상이라, base 가 feature 브랜치면 required check 자체가 적용되지 않는다.
  # No base filter: with `branches: [main]` a PR stacked onto another feature branch never
  # triggered CI at all. This restores visibility only — protection still targets main.
  pull_request:

# 최소 권한 원칙 — GITHUB_TOKEN 을 읽기 전용으로 제한 (회고 P2 공급망 하드닝).
# 모든 job(secret-scan/lint-changed-tests/test-and-analyze/pg-concurrency)이 read 만 필요 — write 필요 step 없음.
# (SonarCloud PR 데코레이션은 SonarCloud GitHub App 경유 — GITHUB_TOKEN write 불필요.)
# Least-privilege — restrict GITHUB_TOKEN to read-only (retro P2 supply-chain hardening).
# All jobs need read only — no write step. (SonarCloud PR decoration goes via the SonarCloud
# GitHub App, not GITHUB_TOKEN.)
permissions:
  contents: read
  # 🔴 PR 본문을 API 로 조회하기 위해 필요 — 없으면 404/403 이고 fail-closed 로 red 가 된다.
  # Needed to fetch the live PR body; absence surfaces as a red check, not a silent pass.
  pull-requests: read

jobs:
  # Layer 2: CI 시크릿 스캔 — 커밋 메시지 + 코드 diff 동시 탐지
  # Layer 2: CI secret scan — detects secrets in both commit messages and code diffs
  secret-scan:
    name: TruffleHog secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for commit message scan)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: TruffleHog — PR 이벤트 시크릿 스캔
        # PR diff 범위만 스캔 — 2026-05-03 사고 유형 방어
        # Scans PR diff range only — guards against 2026-05-03 incident type
        if: github.event_name == 'pull_request'
        # 🔴 핀 범위 정직화 (#1239) — 아래 SHA 는 **action 저장소 커밋**만 고정한다. 실제 스캐너는
        # action 의 `version` 입력 기본값이 `latest` 라 `ghcr.io/trufflesecurity/trufflehog:latest`
        # **가변 태그**에서 온다. 즉 "가변 태그 위험 차단" 은 절반만 참이었다(구 주석 = observer-lie).
        # 스캐너까지 핀하려면 `with: version:` 을 추가해야 하는데, dependabot 은 `uses:` ref 만 올리고
        # `with.version` 은 갱신하지 않아 **새 stale 을 만든다** → 동시성 가드 없이는 도입 금지.
        # 완화책: `permissions: contents: read`(위 15-16줄)로 피해 범위 제한.
        # 🔴 The SHA pins the ACTION repo only; the scanner image comes from the mutable `:latest` tag.
        # 🔴 아래 주석은 **버전 문자열로 끝나야** dependabot 이 SHA 범프 시 함께 재작성한다
        # (`FileUpdater#updated_version_comment` 가 `comment.end_with?(previous_version)` 로 판정).
        # 설명을 뒤에 붙이면 재작성이 skip 돼 주석만 stale 로 남는다 — 그게 이 이슈의 원인이었다.
        # 🔴 Keep the comment ENDING with the version; dependabot only rewrites it in that shape.
        uses: trufflesecurity/trufflehog@bcfcf73aaf4759d4dadc2783177c245a02792318  # v3.97.0
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          # 🔴 `lob` 제외 — 이 프로젝트는 Lob(우편 API)을 쓰지 않는데, 그 탐지기 정규식이
          #    `((live|test)_[A-Za-z0-9_]{35})` 라 **`test_` 로 시작하는 40자 파이썬
          #    테스트 함수명**을 API 키로 오인한다. 게다가 `--only-verified` 인데도
          #    Lob API 가 403/422 를 '활성 키' 로 취급해 **verified 로 확정**해 버린다.
          #    실측(2026-08-06): 리포 안에 그 패턴과 일치하는 테스트명이 **188건** 있고,
          #    그 줄을 건드리는 PR 마다 required 인 이 체크가 무작위로 red 가 된다.
          #    잃는 것은 0이다 — Lob 자격증명은 이 저장소에 존재할 이유가 없다.
          # Exclude the Lob detector: its regex matches 40-char `test_*` Python identifiers
          # and Lob's API marks them verified (403/422 = active key). 188 such names exist here.
          extra_args: --only-verified --exclude-detectors=lob

      - name: TruffleHog — push 이벤트 시크릿 스캔
        # before == zeros(첫 push / force-push) 시 invalid SHA 오류 방지를 위해 건너뜀
        # Skip when before is zeros (first push / force-push) to avoid invalid SHA error
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        # 핀 범위·주석 형식 규약은 위 PR 스텝 주석 참조 (#1239). 두 스텝은 항상 동일 SHA·동일 형식.
        # Pin scope and comment-shape rules: see the PR step above (#1239). Both steps stay in lockstep.
        uses: trufflesecurity/trufflehog@bcfcf73aaf4759d4dadc2783177c245a02792318  # v3.97.0
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.sha }}
          # 🔴 `lob` 제외 — 이 프로젝트는 Lob(우편 API)을 쓰지 않는데, 그 탐지기 정규식이
          #    `((live|test)_[A-Za-z0-9_]{35})` 라 **`test_` 로 시작하는 40자 파이썬
          #    테스트 함수명**을 API 키로 오인한다. 게다가 `--only-verified` 인데도
          #    Lob API 가 403/422 를 '활성 키' 로 취급해 **verified 로 확정**해 버린다.
          #    실측(2026-08-06): 리포 안에 그 패턴과 일치하는 테스트명이 **188건** 있고,
          #    그 줄을 건드리는 PR 마다 required 인 이 체크가 무작위로 red 가 된다.
          #    잃는 것은 0이다 — Lob 자격증명은 이 저장소에 존재할 이유가 없다.
          # Exclude the Lob detector: its regex matches 40-char `test_*` Python identifiers
          # and Lob's API marks them verified (403/422 = active key). 188 such names exist here.
          extra_args: --only-verified --exclude-detectors=lob

  # PR 변경 test 파일 dead-symbol 차단 — 신규 미사용 import(F401)·변수(F841)가 main full-scan
  # CodeQL 에 사후 포착돼 별도 fix PR(#516/#517/#520/#521/#522)을 반복 유발한 cascade 근본 차단(회고 C1, A2: PR diff 한정).
  # Block dead imports/vars in PR-changed test files — newly introduced ones get caught post-merge by
  # the main full-scan CodeQL, causing recurring self-inflicted fix PRs (retro C1, A2 diff-scoped).
  lint-changed-tests:
    name: Lint changed test files (F401/F841 — C1)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for diff)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install flake8
        # 버전 고정(requirements.txt 와 동일) + wheel-only — 재현성 + setup-script 실행 차단.
        # Pinned (matches requirements.txt) + wheel-only — reproducible + blocks setup-script execution.
        run: "pip install --only-binary=:all: flake8==7.3.0"

      - name: Lint PR-changed tests/ for dead symbols (F401/F841)
        # 🔴 --isolated 필수 — setup.cfg per-file-ignore(tests/*:F401,F841)를 우회. 없으면 검사 무력화(false-pass).
        # PR 변경 test 파일만 검사 — 기존 legacy 위반 무관, 신규 도입만 차단. 변경 없으면 통과.
        # --isolated bypasses the setup.cfg per-file-ignore (else it false-passes). PR-changed test files only.
        run: |
          base_sha="${{ github.event.pull_request.base.sha }}"
          changed=$(git diff --name-only --diff-filter=ACMR "$base_sha" HEAD -- 'tests/' | grep -E '\.py$' || true)
          if [ -z "$changed" ]; then
            echo "변경된 test 파일 없음 — skip / no changed test files"
            exit 0
          fi
          echo "검사 대상 / checking:"; echo "$changed"
          python -m flake8 --isolated --select=F401,F841 $changed

      - name: Block new dual-import in PR-changed tests (py/import-and-import-from — C2)
        # 🔴 신규 diff 한정 — PR 에서 ADDED 된 `from X import` 가 기존 `import X` 와 공존하는 경우만 차단.
        # #1023 형(test_config.py 이중 import → self-inflicted CodeQL)의 pre-merge 봉인(회고 2026-07-03 C2).
        # flake8 F401/F841 는 양쪽 import 모두 used 라 미검출 — 별도 stdlib 가드 필요. 기존 legacy idiom 무관.
        # Diff-scoped: only NEW `from X import` coexisting with an `import X` is blocked (retro C2, #1023 pattern).
        run: python scripts/check_dual_import.py "${{ github.event.pull_request.base.sha }}" HEAD

      - name: Block new noqa-hidden unused import in PR-changed tests (py/unused-import — 회고 2026-07-18 B)
        # 🔴 신규 diff 한정 — PR 에서 ADDED 된 `# noqa: F401` 은닉 import 만 차단(기존 ~115 legacy 무관).
        # flake8 F401 은 `# noqa` 를 존중 → side-effect ORM import 가 CodeQL main 스캔에만 노출(#540~545, 3회 재발).
        # 이 가드로 pre-merge 에 튜플-참조 패턴(`_FK_TARGET_MODELS`) 승격 강제 → 반응형 fix PR 종식.
        # Diff-scoped: only NEW noqa-hidden imports are blocked; flake8 respects noqa so CodeQL sees them post-merge.
        run: python scripts/check_noqa_sideeffect.py "${{ github.event.pull_request.base.sha }}" HEAD

      - name: Block new dead-code in PR-changed repositories/services (declared-but-unwired — 회고 2026-07-18 P1#9/14/15)
        # 🔴 신규 diff 한정 — ADDED 된 src/repositories·src/services 공개 함수가 src 내 AST 호출자 0 이면 차단.
        # #1060 find_orphaned 가 호출자 0 dead code 로 13 PR 생존(전 스위트 green 은폐) → #1073 뒤늦은 배선의 재발 봉인.
        # 의도적 미배선은 diff 에 `# unwired-ok: <name>` 마커로 예외(이월 추적). AST 참조라 docstring 멘션 오탐 없음.
        # Diff-scoped: new public repo/service funcs with 0 in-src AST callers are blocked (find_orphaned pattern).
        run: python scripts/check_dead_code.py "${{ github.event.pull_request.base.sha }}" HEAD

  # repo 무결성 stdlib 가드 CI 백스톱 (회고 2026-07-18 P2#36) — pre-commit 우회(--no-verify)·미설치 시에도 서버측 강제.
  # 4 whole-repo 상태 가드(docs↔README 배지·cycle-history TOC 앵커·config↔env-vars·RepoConfig 3-layer)는
  # pre-commit-only 라 우회 가능했다 → 의존성 0(stdlib)·초 단위 완료라 push+PR 양쪽 서버측 백스톱으로 승격.
  # (check_memory_refs=repo 밖 메모리 의존·check_bilingual_comments=staged-diff 기반은 제외 — CI whole-repo 부적합.)
  # Repo-integrity stdlib guard CI backstop — enforces server-side even when pre-commit is bypassed/uninstalled.
  repo-integrity:
    name: Repo integrity guards (stdlib backstop)
    runs-on: ubuntu-latest
    steps:
      # 🔴 fetch-depth: 0 필수 — 정책 19 가드가 `git log base..head` 로 PR 범위 커밋 메시지를
      # 읽는다. 얕은 clone 이면 base 커밋이 없어 명령이 실패하고, 가드는 커밋 축을 **조용히
      # 빈 문자열로 처리**한다(= 커밋 메시지에만 있는 seal 주장을 영영 못 본다, Grok 적발).
      # 🔴 Required: the policy-19 guard reads PR-range commit messages via `git log base..head`.
      # A shallow clone makes that fail and the commit axis silently degrades to empty.
      - name: Checkout (full history — 정책 19 가드가 PR 범위 커밋을 읽는다)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # 🔴 커밋된 충돌 마커는 배지 정합보다 **먼저** 본다 — check_docs_sync --fix 가
      #    충돌 블록 안쪽을 고쳐 쓰기 때문에, 순서가 뒤바뀌면 깨진 파일 위에서 초록이 난다.
      #    (2026-08-12 Grok `019ff301` 적발 — 초판은 주석만 '먼저' 라 적고 실제 순서는 뒤였다.)
      - name: 병합 충돌 마커 차단 (check_conflict_markers)
        run: python scripts/check_conflict_markers.py

      - name: STATE↔README 배지 수치 정합 (check_docs_sync)
        run: python scripts/check_docs_sync.py
      - name: architecture 트리 싱크 (check_architecture_tree_sync)
        run: python scripts/check_architecture_tree_sync.py

      - name: 가드 fail-open floor (check_guard_fail_open)
        run: python scripts/check_guard_fail_open.py

      - name: config.py↔env-vars.md 싱크 (check_env_vars_sync)
        run: python scripts/check_env_vars_sync.py

      - name: RepoConfig 3-layer 싱크 (check_config_5way_sync)
        run: python scripts/check_config_5way_sync.py
      # 🔴 **이 조회는 본문을 읽는 모든 스텝 앞에 있어야 한다** (2026-08-22 실측).
      #    최초 도입(#1464)은 「테스트 수치」 스텝 하나만 이 값으로 바꿨고, 같은 본문을 읽는
      #    정책 19(claim-review)·역-뮤테이션 두 스텝은 `github.event.pull_request.body`
      #    를 그대로 봤다. 그래서 본문을 고치고 rerun 해도 그 둘은 **낡은 값**을 다시 읽어
      #    빨강이 지워지지 않았다 — 고친 축만 낫고 나머지는 그대로인 부분 적용이었다.
      #    The original fix rewired only one consumer; the other two kept reading the frozen
      #    payload, so a body edit + rerun still could not clear them.
      - name: PR 본문 조회 (살아 있는 값 — 고정 페이로드 아님)
        id: prbody
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          body="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" -q '.body // ""')"
          {
            echo "body<<__PR_BODY_EOF__"
            printf '%s\n' "$body"
            echo "__PR_BODY_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: 정책 19 — seal 주장 시 claim-review 흔적 강제
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ steps.prbody.outputs.body }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # base **이름** — 판정에 쓰지 않고 고지에만 쓴다. base 가 main 이 아니면 이 PR 에는
          # required check 가 적용되지 않는다(보호 대상은 main 뿐) → 저자에게 그 사실을 알린다.
          # Advisory only: a non-main base means required checks do not gate that PR at all.
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          # 저자 신원은 이벤트에서만 — 본문은 자기인증이라 못 믿는다.
          # 봇(Dependabot)은 흔적도 면제 마커도 쓸 수 없어 이 축이 없으면 영구 차단이다.
          # Author identity from the event only; bots can write neither a trace nor the marker.
          PR_AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: python scripts/check_claim_review_trace.py


  # 🔴 src/ 정적 분석 게이트 — 이전엔 **어떤 자동면에도 없었다** (회고 2026-07-03 D13).
  # `make lint` 은 pylint·flake8·bandit 를 전부 `|| true` 로 삼켜 **실패할 수 없고**(지금도 그렇다 —
  # 위반 열람 전용), `make lint-strict`(fail-under 9.90)는 CI·pre-commit 어디서도 호출되지 않는
  # 문서-only 였다. 🔴 그 뒤 도입된 `make gate` 는 `|| true` 없이 pylint·bandit 를 강제하는
  # **로컬 CI-등가 게이트**다(Makefile `gate:`) — 아래 job 과 린터 기준이 같다. 혼동 금지.
  # 그 상태에서 CLAUDE.md 는 "Phase 완료 조건 = /lint 통과" 를 선언했다 — 즉 커밋 본문의
  # "lint 통과" 주장이 **기계로 검증 불가**했다. 로컬 fail-closed 는 강제력이 아니라 마찰이므로
  # (Grok 적대 검토 2026-07-20), 실제 게이트를 **여기** 둔다.
  # Static-analysis gate for src/: previously enforced on NO automated surface — the Makefile
  # swallowed every linter with `|| true` and lint-strict was never wired. Local fail-closed is
  # friction, not enforcement; the real gate belongs in CI.
  #
  # 🔴 flake8 전체는 의도적 제외 — 현재 src/ 에 E501(라인 길이) 계열 15건이 있고, 이를 강제하면
  # 12개 파일을 미용 목적으로 고쳐야 한다. 정책 17(안정성 > 권장 규격) + "과한 게이트는 사람이
  # 게이트를 끄게 만든다". F401/F841(실질 결함)은 기존 lint-changed-tests job 이 이미 담당한다.
  lint-src:
    name: Static analysis gate (pylint + bandit on src/)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # 회귀 가드 — 현재 9.99/10.
      # 🔴 floor 는 리터럴이 아니라 **README 배지에서 파생**한다(2026-08-12 문서감사 PR-4).
      #    리터럴 9.90 이던 시절엔 배지가 10.00 을 주장해도 9.99 가 초록이라, 배지가 아무것도
      #    집행하지 않았다. 이제 배지가 곧 게이트다 — 지키지 못하면 배지를 내리는 것이 유일한
      #    통과 경로이고, 그 하향은 test_lint_badge_truth.py 의 floor 단언이 막는다.
      # The floor is parsed from the README badge, so an inflated badge fails its own build.
      - name: pylint 회귀 가드 (fail-under = README 배지값)
        run: |
          score="$(grep -oP 'badge/pylint-\K[0-9]+\.[0-9]+' README.md | head -1)"
          if [ -z "$score" ]; then echo "::error::README pylint 배지를 읽지 못했다"; exit 1; fi
          # 🔴 배지는 **소수 2자리 반올림 표기**다 — 실점수는 그보다 최대 0.005 낮을 수 있다.
          #    배지값을 그대로 floor 로 쓰면 **정직한 배지도 red** 가 된다(2026-08-12 실측:
          #    표기 9.99 · 배지 9.99 → `--fail-under=9.99` 가 exit 18, `9.90` 은 exit 0).
          #    그래서 반올림 폭만 빼고, 그 이상은 봐주지 않는다 — 배지 10.00 이면 floor 9.995 라
          #    9.99 점수는 여전히 red 다(부풀린 배지는 자기 빌드를 실패시킨다).
          # The badge is rounded to 2 decimals; subtract exactly that rounding width, no more.
          floor="$(awk -v s="$score" 'BEGIN{printf "%.3f", s-0.005}')"
          echo "README 배지 ${score} → --fail-under ${floor} (반올림 폭 0.005 만 허용)"
          pylint --fail-under="$floor" src/

      # 보안 정적 분석 — nosec 주석은 통과, 신규 미주석 findings 는 fail.
      # Security static analysis; annotated nosec passes, new unannotated findings fail.
      - name: bandit 보안 스캔
        run: bandit -r src/ -q

  # 템플릿 인라인 JS 린트 공허화 차단 (#1227 항목 3 — 사용자 결정: advisory + 공허화만 fail-closed).
  # 🔴 `make lint-js` 는 `npx eslint … || true` 라 모든 실패를 삼켰고, **어떤 workflow 에도 배선돼
  # 있지 않았다**(`.github/` 전역 참조 0건). 그래서 #1222(eslint 8→10) 창에서 설정이 완전히 깨져
  # 0개 파일을 검사하는 동안에도 CI 는 초록이었다 — "위반 0건" 과 "아무것도 검사 안 함" 이 구별 불가.
  # 이 job 은 위반으로는 실패하지 않고(기존 advisory 성격 보존), **검사 범위가 비면** 실패한다.
  # Anti-vacuity gate for template inline-JS linting (#1227 item 3). `make lint-js` swallowed every
  # failure and was wired into no workflow at all, so CI stayed green while eslint linted zero files
  # during the #1222 bump. This job never fails on violations — only when nothing was checked.
  lint-js-nonvacuous:
    name: lint-js 공허화 차단 (검사 범위 비면 fail)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # eslint 는 devDependency — `npm ci` 로 lockfile 그대로 설치(재현성).
      # `--ignore-scripts` = 공급망 hardening: 이 job 은 eslint 의 JS 만 실행하므로 lifecycle
      # 스크립트가 필요 없다(빌드 산출물 미사용).
      # eslint is a devDependency; `npm ci` installs it exactly as locked. `--ignore-scripts` is
      # supply-chain hardening — this job only runs eslint's JS and needs no lifecycle scripts.
      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: lint-js 공허화 차단
        run: python scripts/check_lint_js_nonvacuous.py

  # 의존성 취약점 SCA 게이트 — PyPI Advisory DB(OSV) 대조로 known CVE 차단(회고 2026-07-03 C7).
  # requirements 가 == 핀(CI==Railway 버전 일치)이므로 스캔 대상 = 실제 배포 버전. 신규 CVE 발표 시 CI fail →
  # 의존성 bump 강제(현재 취약점 0 실측). 프로덕션+개발 의존성 모두 대상.
  # Dependency SCA gate — blocks known CVEs via PyPI Advisory DB (OSV) (retro 2026-07-03 C7).
  # requirements are == pinned (CI==Railway versions), so the scan targets the actual deployed set.
  dependency-audit:
    name: pip-audit (SCA — 의존성 취약점 게이트)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: "pip install --only-binary=:all: pip-audit==2.10.1"

      - name: Audit requirements for known vulnerabilities
        # -r 로 requirements 파일 직접 스캔(설치 불필요). vuln 발견 시 exit 1 → CI fail(게이트).
        # Scan requirements files directly (no install). Non-zero exit on any vuln → gate.
        #
        # 🔴 --ignore-vuln 4건 = semgrep 이 강제하는 transitive 핀 (2026-07-17).
        # semgrep==1.169.0 이 `mcp==1.23.3`(정확 핀) + `click~=8.1.8` 을 요구한다. 최신
        # semgrep 1.170.0 도 동일 핀이라 **버전 업으로 해결 불가** — 우리가 고를 수 있는
        # semgrep 버전 중 패치본이 없다. 4건 모두 우리 사용 방식에선 **도달 불가**:
        #   · semgrep 은 `["semgrep","scan","--config=p/default","--json",…]` 비대화형 CLI
        #     subprocess 로만 호출(src/analyzer/io/tools/semgrep.py) — MCP 서버 미기동.
        #   · CVE-2026-52870 = `server.experimental.enable_tasks()` 전제 → 전 코드 0건.
        #   · CVE-2026-52869 = SSE/StreamableHTTP 서버 트랜스포트 전제 → 전 코드 0건.
        #   · CVE-2026-59950 = `mcp.server.websocket.websocket_server` 전제 → 전 코드 0건.
        #   · PYSEC-2026-2132 = `click.edit()` 명령 주입 전제 → 전 코드 0건.
        # (src/mcp/ 는 스키마 선언만 있는 별개 모듈로 semgrep 의 mcp 패키지와 무관.)
        #
        # 🔴 재검토 조건 (충족 시 해당 ID 를 즉시 제거할 것):
        #   (1) semgrep 이 mcp 핀을 >=1.27.2 / click 핀을 >=8.3.3 으로 올리면 → 전부 제거
        #   (2) 우리가 MCP **서버**를 실제 기동하게 되면 (enable_tasks / HTTP·WS 트랜스포트)
        #       → mcp 3건 즉시 제거 (도달 불가 근거가 무효화됨)
        #   (3) click.edit() 를 쓰게 되면 → PYSEC-2026-2132 즉시 제거
        # 이 목록은 "방치되면 썩는" 자산이다 — 신규 ID 를 습관적으로 추가하지 말 것.
        # 다른 CVE 는 계속 게이트로 차단된다 (ignore 는 명시 4건 한정).
        #
        # 🔴 --ignore-vuln (4 IDs) = transitive pins forced by semgrep (2026-07-17).
        # semgrep==1.169.0 requires `mcp==1.23.3` (exact) + `click~=8.1.8`; the latest semgrep
        # (1.170.0) pins identically, so no bump fixes this. All 4 are unreachable in our usage:
        # semgrep runs only as a non-interactive CLI subprocess (never an MCP server), and
        # enable_tasks / SSE / StreamableHTTP / websocket_server / click.edit appear 0 times in
        # our tree. Remove any ID the moment its precondition becomes true (see conditions above).
        # Every other CVE still fails the gate — this ignore list is exactly 4 entries.
        run: |
          python -m pip_audit -r requirements.txt -r requirements-dev.txt --desc on \
            --ignore-vuln CVE-2026-52870 \
            --ignore-vuln CVE-2026-52869 \
            --ignore-vuln CVE-2026-59950 \
            --ignore-vuln PYSEC-2026-2132

  test-and-analyze:
    name: pytest + Codecov + SonarCloud
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout (with full history for SonarCloud)
        uses: actions/checkout@v7
        with:
          # SonarCloud 가 새 파일/변경 이력을 제대로 분석하려면 shallow-clone 금지
          # Full history required so SonarCloud can analyse new files and change history correctly.
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies (정적분석 도구)
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck cppcheck

      - name: Install Node.js (eslint)
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install global eslint
        run: npm install -g eslint@9 @typescript-eslint/parser @typescript-eslint/eslint-plugin

      # 🔴 `npm ci` 필수 — eslint 분석기의 flat config(`src/analyzer/configs/*.mjs`)가
      # `@typescript-eslint/parser` 를 **리포 로컬**에서 import 한다. 전역 설치본은 설정 파일
      # 위치 기준 해석에 걸리지 않아 `ERR_MODULE_NOT_FOUND` 로 죽는다(#1226 CI 실측).
      # 운영(railway.toml)은 buildCommand 끝에서 이미 `npm ci` 를 돌리므로 이 step 이 CI 를
      # 운영과 일치시킨다. `--ignore-scripts` = 공급망 hardening(빌드 산출물 미사용).
      # 🔴 `npm ci` is required: the analyzer's flat config imports @typescript-eslint/parser from
      # the repo-local node_modules; a global install is not resolvable from the config's location.
      # Railway already runs `npm ci`, so this aligns CI with production.
      - name: Install npm dependencies (analyzer eslint flat config)
        run: npm ci --ignore-scripts

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --retries 5 --timeout 60 -r requirements-dev.txt

      # 🔴 **pip 설치 뒤에 둔다** — `slither`·`solc-select` 는 requirements 로 오므로
      #    이 step 이 앞에 있으면 `command -v slither` 가 실패한다(CI 실측 2026-08-18).
      # Must run after pip: slither/solc-select arrive via requirements.
      # 🔴 조달 계약(`PROVISIONED_ANALYZERS`) 전량을 CI 에서도 설치한다 (#1444).
      #
      # 실측(2026-08-18): 계약 16종 중 CI 가 설치하는 것은 10종이었다. 빠진 6종
      # (golangci-lint · hadolint · ktlint · rubocop · tflint · tsc)은 **CI 에서 한 번도
      # 실행된 적이 없다.** 그래서 그 도구들의 테스트가 전량 mock 이고 `tests/integration/`
      # 에 실바이너리 테스트가 0건이었다 — 조달되지 않으니 쓸 수가 없었다.
      # 계약의 뜻은 「이 도구가 사라지면 배포 회귀다」인데, 그 주장을 아무도 확인한 적이 없었다.
      #
      # 🔴 `|| echo WARNING` 으로 삼키지 않는다. `railway.toml` 은 배포 가용성을 위해 삼키고
      # 그 부재는 런타임이 `incomplete` 로 잡는다(#1410). CI 는 반대다 — **여기가 조달이
      # 실제로 되는지 확인하는 유일한 자리**이므로 실패는 red 여야 한다. 일시적 네트워크
      # 실패는 `gh run rerun --failed` 로 처리한다(인프라 실패는 재실행, 재발은 롤백).
      #
      # 🔴 버전은 `railway.toml` 과 맞춘다 — CI 가 운영과 다른 버전을 검증하면 그 초록은
      # 운영에 대해 아무 말도 하지 않는다.
      # Provision the whole contract in CI; failures are red here (unlike Railway, which
      # degrades gracefully because runtime detection catches absence).
      - name: Install contracted analyzers (조달 계약 전량 — railway.toml 과 동일 버전)
        run: |
          set -euo pipefail
          # 🔴 `sudo` — Railway 빌드는 root 로 돌지만 GitHub 러너는 아니다. `--bindir /usr/bin`
          #    같은 시스템 경로 쓰기는 여기서 `Gem::FilePermissionError` 가 된다(CI 실측).
          #    경로는 운영과 맞춘다(`/usr/bin`) — 경로가 갈리면 PATH 해석 차이가 숨는다.
          sudo gem install rubocop-ast -v 1.36.2 --no-document --bindir /usr/bin
          sudo gem install rubocop -v 1.57.2 --no-document --bindir /usr/bin
          curl -sSfL --retry 3 https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh \
            | sudo sh -s -- -b /usr/bin v1.55.2
          # 🔴 이 3종은 `latest` 였다 (2026-08-19 정정). 형제는 전부 핀인데 여기만 상류 릴리스가
          #    리포 변경 0줄로 파이프라인을 바꿀 수 있었고, CI 와 Railway 가 `latest` 를 **다른
          #    시점에** 해석해 조용히 갈렸다. 버전을 올릴 때는
          #    `tests/integration/test_contracted_analyzers_real_binary.py` 가 새 바이너리의
          #    출력으로 파서 계약을 다시 잰다 — 핀만 바꾸고 그 테스트를 안 돌리면 의미가 없다.
          sudo curl -sSfL --retry 3 https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-Linux-x86_64 \
            -o /usr/bin/hadolint
          sudo chmod +x /usr/bin/hadolint
          sudo curl -sSfL --retry 3 https://github.com/pinterest/ktlint/releases/download/1.8.0/ktlint \
            -o /usr/bin/ktlint
          sudo chmod +x /usr/bin/ktlint
          curl -sSfL --retry 3 https://github.com/terraform-linters/tflint/releases/download/v0.64.0/tflint_linux_amd64.zip \
            -o /tmp/tflint.zip
          sudo unzip -o /tmp/tflint.zip -d /usr/bin/
          sudo chmod +x /usr/bin/tflint
          npm install -g 'typescript@>=6.0.3 <6.1.0'
          # slither 는 pip(requirements.txt)로 오지만 Solidity 를 실제로 분석하려면 solc 가 필요하다.
          # 🔴 `solc-select` 는 requirements.txt 에 **없다** — slither-analyzer 의 전이 의존에
          #    기대고 있다(railway.toml 도 같은 가정). 전이가 끊기면 이 step 이 하드 실패하므로
          #    부재 시에만 명시 설치한다. 있으면 no-op 이라 운영과 갈리지 않는다.
          # solc-select is only a transitive dep; install it explicitly if that ever breaks.
          command -v solc-select >/dev/null || pip install solc-select
          solc-select install 0.8.20
          solc-select use 0.8.20
          for t in rubocop golangci-lint hadolint ktlint tflint tsc slither; do
            command -v "$t" >/dev/null || { echo "🔴 조달 실패: $t"; exit 1; }
          done
          echo "✅ 조달 계약 전량 확인 — 위 for 루프가 실제 실행 가능성을 본다"

      - name: Run pytest with coverage (XML for Codecov + SonarCloud)
        env:
          # conftest.py 에서 setdefault 되지만 CI 환경이라 중복 안전
          # Also set by conftest.py via setdefault, but harmlessly redundant in CI.
          DATABASE_URL: "sqlite:///:memory:"
          GITHUB_WEBHOOK_SECRET: "test_secret"
          TELEGRAM_BOT_TOKEN: "123:ABC"
          TELEGRAM_CHAT_ID: "-100123"
          SESSION_SECRET: "test-session-secret-32-chars-long!"
        run: |
          python -m pytest tests/ \
            --cov=src \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --junitxml=pytest-results.xml \
            -rs -q

      # 🔴 P1 역-뮤테이션 게이트 (2026-08-07 다중 관점 진단의 **지배 원인** 직격).
      #
      # 🔴 **이 job 에 있어야 한다** — 게이트가 pytest 를 돌리기 때문이다. 처음에는
      #    `repo-integrity`(stdlib 백스톱)에 뒀는데 그 job 은 **의존성 설치 step 이 0개**라
      #    pytest 를 실행할 수 없었고, 게이트가 *"되돌리기 전에 이미 red — 판정 불가"* 로
      #    fail-closed 했다(CI 실측). 그 자체는 옳은 동작이지만 배치가 틀렸다.
      #
      # 진단: 이 저장소가 반복해 온 결함의 형태는 하나로 수렴한다 —
      #   *결함을 고친 당사자가 그 결함을 검증할 관측자를 같은 PR 안에서 만들고,
      #    그 관측자는 하필 그 PR 이 고친 결함에만 맹목이다.*
      # 산문 규칙으로는 닫히지 않는다(🔴 337개 중 실측 준수율 0/42 인 정책이 있고,
      # R43 은 발화율 100% / 이행률 0% 다). 그래서 **기계 질문**으로 바꾼다:
      #   "이 PR 의 변경을 되돌리면, 이 PR 이 추가한 테스트가 실패하는가?"
      #
      # 🔴 소급 검증으로 채택했다 — `#1297`·`#1298`·`#1299`·`#1300`·`#1305` 에 돌려 **5/5 red**
      #   (채택 기준 ≥4/5). 반대 방향도 실증: 공허한 테스트를 심은 통제 실험에서 exit 1.
      # 판정 불가(범위 산출 실패·baseline 이미 red·되돌림 no-op)는 **전부 실패**다.
      # 판정할 수 없는 변경은 `reverse-mutation-not-applicable:` 로 명시 면제(계수됨).
      # Reverse-mutation gate: revert the PR's production diff, re-run only its tests, require red.
      - name: PR 본문 조회 (살아 있는 값 — 고정 페이로드 아님)
        id: prbody
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          body="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" -q '.body // ""')"
          {
            echo "body<<__PR_BODY_EOF__"
            printf '%s\n' "$body"
            echo "__PR_BODY_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: P1 역-뮤테이션 — 이 PR 의 테스트가 이 PR 의 변경을 관측하는가
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ steps.prbody.outputs.body }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/check_reverse_mutation.py

      # 🔴 테스트 수치 ground-truth 축 (회고 2026-07-31 P0-D · backlog R25) — check_docs_sync 는
      # 문서 사본끼리만 대조해 5지점 동시 오류가 GREEN 이었다(실측: 문서 6205 vs 실측 6269).
      #
      # 🔴 **2026-08-07: PR 에서도 차단한다** (P2). 이전에는 `--advisory-drift`(exit 0)라
      #    드리프트가 PR 을 통과했고, main push 에서만 enforce 돼 **막을 수 없는 곳에서만**
      #    빨개졌다. 실제 사고: 오판독한 정수 하나가 `--fix` 로 4지점에 전파돼 사본은
      #    완벽히 일치(check_docs_sync ✅) → PR 통과 → 머지 → **main CI 2연속 red**.
      #    advisory 를 유지하던 근거였던 주석("브랜치 보호 부재라 red 가 머지를 막지 못한다")은
      #    **이미 거짓**이다 — required 10종 + enforce_admins:true 가 살아 있다(API 실측).
      #
      # 🔴 배치-PR 이월은 없애지 않고 **명시 면제**로 승격한다: `STATE-sync-deferred: <사유>`
      #    를 적으면 통과하되 job summary 에 계수된다. 조용한 통과 → 보이는 결정.
      # 🔴 **2026-08-08(회고 N-P0-2): 마커는 커밋 메시지에서만 유효하다.** 초판은 PR 본문에서만
      #    읽혀서, push 이벤트(머지 후 main)에는 본문이 전달되지 않아 **마커를 처음 쓰는 사람이
      #    main 을 빨갛게 만드는** 구조였다 — 이 마커가 없애려던 사고 그 자체다. 그래서 두 이벤트가
      #    같은 운반체(커밋 메시지)를 읽는다. `PR_BODY` 는 여전히 전달하되, 본문에만 있는 마커는
      #    PR 단계에서 **명시적으로 실패**시켜 저자가 그 자리에서 고치게 한다.
      # 🔴 도구/파싱 실패는 **양쪽 모드 다 exit 1** (Grok claim-review 019fb930 — `|| true` 경계).
      # Both events read the same durable carrier (commit messages); a body-only marker fails loudly.
      # 🔴 본문을 **API 로 조회**한다 — `github.event.pull_request.body` 가 아니다 (2026-08-21).
      #    그 값은 이벤트 생성 시점에 고정되므로 저자가 본문을 고쳐도 이 실행은 낡은 값을
      #    보고, `gh run rerun` 은 **원래 이벤트를 재생**해 같은 낡은 값을 다시 읽는다.
      #    복구 수단이 「새 SHA」 하나뿐이 되어, 가드가 **고칠 수 없는 것을 검사**했다.
      #    실측(2026-08-18~20): CI 실패 9건 중 4건이 이 축 · 같은 기간 push 후 본문 편집 19회.
      #    Fetch the body live: the event payload is frozen at event time and `gh run rerun`
      #    replays it, so a body edit could never fix the run — only a new SHA could.
      #
      # 🔴 fail-closed — 조회 실패가 **빈 본문**으로 흘러가면 `check_body_claim` 이
      #    「미실행」 경로로 떨어져 **초록**이 된다. `set -euo pipefail` + 폴백 없음.
      #    수치를 커밋 메시지로 옮기는 안은 기각했다(Grok claim-review `01a02149` P4):
      #    실패 4건은 본문에 수치가 **이미 있었고** 고정본이라 낡았을 뿐이라,
      #    「본문에 없을 때만 커밋을 본다」는 폴백은 그중 하나도 막지 못한다.
      - name: 테스트 수치 ↔ 실측 대조 (PR — 차단)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ steps.prbody.outputs.body }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # 저자 신원은 이벤트에서만 — 본문 마커는 자기인증 (R48 공허 통과 차단).
          # Author identity from the event, never from the body (self-certification trap).
          PR_AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: python scripts/check_test_count_sync.py

      # 🔴 push 도 **범위**로 읽는다 — `git log -1` 은 틀린 답이었다(Grok claim-review 019fe026).
      #    이 리포는 merge-commit·rebase-merge 가 둘 다 허용돼 있어(API 실측), tip 커밋에
      #    마커가 없는 머지 방식이 존재한다 → PR 초록 → main red 로 사고가 재현된다.
      # The push reads every commit it introduced; a merge commit's tip would hide the marker.
      - name: 테스트 수치 ↔ 실측 대조 (main push — enforce)
        if: github.event_name == 'push'
        env:
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: python scripts/check_test_count_sync.py

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: SonarCloud scan
        # Dependabot PR 는 GitHub 보안 정책상 SONAR_TOKEN 시크릿에 접근 불가 — 건너뜀
        # Dependabot PRs cannot access SONAR_TOKEN due to GitHub security policy — skip.
        if: github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  # SKIP LOCKED 동시성 증명 — Postgres service container (SQLite 미지원 FOR UPDATE SKIP LOCKED).
  # claim_batch 의 SKIP LOCKED 회귀를 CI 에서 실측 차단 (Theme B S3). test-and-analyze 와 병렬(needs: secret-scan).
  # SKIP LOCKED concurrency proof — needs a real Postgres (SQLite has no FOR UPDATE SKIP LOCKED).
  pg-concurrency:
    # job name 은 step(SKIP LOCKED + round-trip)을 모두 반영 — 사이클 157 #8 에서 round-trip 추가됐으나
    # 명칭이 미반영이라 GitHub checks UI 에서 round-trip 회귀 담당이 가려졌음 (사이클 159 — 158 회고 P2).
    # 🔴 2026-08-05 정정: "main 은 branch protection 미적용 — required-check 명 변경 영향 없음"
    #    은 더 이상 사실이 아니다. main 은 보호 활성이고 이 job 이름은 **required check 9종에
    #    포함**된다. job `name:` 을 바꾸면 required 목록의 context 와 어긋나 머지가 영구 차단된다
    #    — 이름 변경 시 branch protection 의 required_status_checks 도 함께 갱신할 것.
    # main IS protected now and this job name is one of the 9 required contexts; renaming it
    # without updating branch protection blocks every merge.
    name: PG-only tests (SKIP LOCKED + migration round-trip)
    runs-on: ubuntu-latest
    needs: secret-scan
    services:
      postgres:
        # minor 핀 — `postgres:16` 은 패치 릴리스마다 silently 변경됨. 이 job 은 FOR UPDATE
        # SKIP LOCKED + alembic ALTER constraint 등 PG 버전 민감 동작을 검증하므로 재현성을
        # 위해 minor 고정 (사이클 159 — 158 회고 P2). 주기적으로 최신 16.x 로 bump 권장.
        # Minor pin for reproducibility — `postgres:16` drifts on each patch release.
        image: postgres:16.4
        env:
          POSTGRES_USER: scatest
          POSTGRES_PASSWORD: scatest
          POSTGRES_DB: scatest
        ports:
          - 5432:5432
        # health-check 로 DB 준비 완료까지 대기 (부팅 ~20-40s)
        # Wait for DB readiness via health-check (boot ~20-40s)
        options: >-
          --health-cmd "pg_isready -U scatest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --retries 5 --timeout 60 -r requirements-dev.txt

      - name: Run PG-only tests (SKIP LOCKED 동시성 + 마이그레이션 round-trip)
        # DATABASE_URL_TEST_POSTGRES 단일 env 가 필수 — DATABASE_URL 은 conftest.py 가 sqlite 로 덮어씀(무의미).
        # Only DATABASE_URL_TEST_POSTGRES matters — conftest.py overrides DATABASE_URL with sqlite.
        # 명시 파일 경로만 실행 — e2e/integration 혼입 방지 (testing.md 🔴 격리 규칙). --timeout=60 deadlock guard.
        # 순서: 동시성 테스트(drop_all cleanup) → round-trip (사이클 157 #8). round-trip 은 사이클 159 부터
        #   DROP/CREATE SCHEMA 로 self-isolating — 순서·선행 cleanup 에 의존하지 않는다 (158 회고 P2).
        # 🔴 round_trip 파일에 PG 전용 테스트를 추가하면 아래 ::node-id 핀에 함께 등재해야 자동 수집됨
        #    (node-id 고정이라 신규 테스트는 자동 미수집 — 사이클 159 cross-verify 신규).
        # Order: concurrency → round-trip (self-isolating since Cycle 159). Add new PG-only tests in
        #   test_0020_round_trip.py to the ::node-id pin below, else they won't be collected.
        env:
          DATABASE_URL_TEST_POSTGRES: "postgresql://scatest:scatest@localhost:5432/scatest"
        run: |
          python -m pytest \
            tests/integration/test_retry_concurrency_postgres.py \
            tests/integration/test_retention_sweep_postgres.py \
            tests/integration/test_session_timezone_postgres.py \
            tests/unit/migrations/test_0020_round_trip.py::test_migration_alembic_round_trip \
            tests/unit/migrations/test_0020_round_trip.py::test_migration_0041_force_round_trip_postgres \
            tests/unit/migrations/test_0020_round_trip.py::test_migrations_idempotent_over_prod_drift_postgres \
            tests/unit/migrations/test_orm_alembic_parity.py::test_orm_metadata_matches_migrations \
            -v -rs --timeout=60

  # E2E (Playwright) — backlog R7 해소: 122건이 "로컬 전용" 으로 CI 어디에서도 실행되지
  # 않던 상태를 끝낸다. 그 상태의 진짜 위험은 미실행 자체가 아니라 **아무도 그것을
  # 관측하지 않는다는 것**이었다(README 배지는 #1237 로 이미 정직화됐지만 실행은 0이었다).
  # E2E suite was never executed anywhere in CI (R7). This job ends that.
  #
  # 🔴 자족적이라 서비스 컨테이너가 필요 없다 — `e2e/conftest.py` 가 SQLite 임시 DB +
  #    더미 시크릿을 스스로 넣고 uvicorn 을 별도 스레드로 띄운다(`:103-111`, `:135-159`).
  # 🔴 `-p no:asyncio` 의무 — `e2e/pytest.ini` 는 `asyncio_mode` 를 의도적으로 생략한다.
  #    단위 스위트와 같은 프로세스에서 섞이면 이벤트 루프가 충돌한다(testing.md §E2E 격리).
  # 🔴 required check 로 **승격됐다** (실측 2026-08-17: `gh api …/required_status_checks` 의
  #    10종에 `E2E (Playwright)` 가 있다). 종전 주석은 «승격하지 않았다 — 안정성 데이터를
  #    모은 뒤 판단한다» 로 남아 있었고, 승격 이후에도 갱신되지 않아 거짓이었다.
  #    이름을 바꾸면 required check 가 영영 pending 이 된다 — `branch-protection.md` §이름 변경 4곳.
  # Promoted to a required check; the old "not promoted yet" note outlived the promotion.
  e2e:
    # 잡 이름에 건수를 박지 않는다 — 스위트가 늘면 이름이 조용히 거짓이 된다.
    # No count in the job name: it silently goes stale as the suite grows.
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: secret-scan
    # 실측 ~10초/건 → 122건 ≈ 20분. 여유 포함 30분에서 자른다.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install --retries 5 --timeout 60 -r requirements-dev.txt

      # 🔴 CSS 빌드 산출물이 없으면 **운영에 존재할 수 없는 형태**를 검증하게 된다.
      # `src/static/css/dist/tailwind.css` 는 `.gitignore` 된 빌드 산출물이라 체크아웃에
      # 없다 → 서버가 404(HTML)를 주고 브라우저가 `Refused to apply style from …` 을 낸다.
      # 실제로 `test_dashboard_no_js_runtime_errors` 가 이 이유로 red 였고, 그것을 CSP
      # 결함(#1294)과 **구별할 수 없었다** — 한 테스트에 두 원인이 겹쳐 있었다.
      # `railway.toml` 의 배포 빌드도 `npm ci && npm run build` 로 끝난다(동일 형태 맞춤).
      # Without the CSS build the job tests a shape that cannot exist in production.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Build CSS (운영과 동일 산출물)
        run: npm ci --ignore-scripts && npm run build

      # `--with-deps` 로 브라우저 + OS 라이브러리를 함께 설치 (ubuntu 러너 필수).
      - name: Install Playwright chromium
        run: python -m playwright install --with-deps chromium

      # 🔴 `--timeout` 의무 — 이 잡에만 없었다. 셀렉터가 죽으면 Playwright 가 건당
      #    30초를 소진하고, 그런 건이 여럿이면 잡 전체가 30분 벽에 붙어 **원인 없이**
      #    죽는다. 단위 잡은 이미 `--timeout=60` 을 쓴다(R52 완전성 비평 C-2).
      # 🔴 **검사 범위 baseline** — 수집 건수가 줄면 fail (backlog R58).
      # `conftest.py` 가 skip 을 실패로 바꿔도 **테스트를 지우거나 조건부로 빼는** 축소는
      # 여전히 조용히 통과한다. 커밋된 기대값(`e2e/EXPECTED_COUNT`)과 대조해 그 축을 닫는다.
      # Guards against silent scope shrink: a smaller collection is a failure, not a pass.
      - name: E2E 검사 범위 확인 (수집 건수 ↔ baseline)
        run: python scripts/check_e2e_scope.py

      # 🔴 `-p no:randomly` 가 아니라 **최소 통과 건수** 가 핵심이다 (backlog R58 · Grok 71bd2d6c).
      # 수집 건수 baseline 을 통과해도 **전부 skip 되면** pytest 는 exit 0 을 낸다 —
      # `pytest.mark.skip`·`skipif`·픽스처 skip 어느 경로든 같은 결말이다.
      # `--strict-markers` 는 이 축을 못 본다. 통과 건수 하한이 유일한 관측면이다.
      # A collection-count baseline does not stop mass-skip: pytest exits 0 when all skip.
      - name: Run E2E suite
        run: python -m pytest e2e/ -q -rs -p no:asyncio --timeout=120 --e2e-min-passed=100

      # 🔴 실패 시 trace/스크린샷을 남긴다 — 이게 없어서 R52 진단이 **로그 고고학**이
      #    됐다(요약이 잘린 텍스트 로그만으로 30건을 역추적). 다음 회귀는 그러지 않도록.
      #    Without artifacts the previous diagnosis had to reconstruct failures from a
      #    truncated text log. Keep evidence for the next regression.
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-artifacts
          path: |
            test-results/
            e2e/**/*.png
            e2e/**/*.zip
          if-no-files-found: ignore
          retention-days: 7
