# PR 본문 편집 시 repo-integrity 재평가 — 정책 19 claim-review 가 **본문**을 읽기 때문.
#
# 🔴 왜 필요한가 (2026-08-01 실측)
# `check_claim_review_trace.py` 는 `github.event.pull_request.body` 를 읽는다. 그런데 `ci.yml` 의
# `on.pull_request` 에 `types:` 가 없어 기본값(`opened`·`synchronize`·`reopened`)만 발화한다 →
# **본문만 고쳐서는 CI 가 다시 돌지 않는다.** 게다가 `gh run rerun` 은 **원래 이벤트 payload**
# (= 옛 본문)를 재생하므로 재실행해도 같은 실패가 반복된다. 실측: PR #1260 이 이 이유로 두 번
# 막혔고, 결국 **의미 없는 force-push** 로 `synchronize` 를 억지로 발화시켜야 했다.
#
# 🔴 왜 `ci.yml` 에 `edited` 를 그냥 추가하지 않는가
# 그러면 본문 오타 한 번에 **8 job 전체**(CodeQL·pytest·PG 서비스 포함)가 다시 돈다. `edited` 는
# 제목·본문·base 변경 모두에서 발화하므로 제목 손질에도 전체가 돈다.
#
# 🔴 **이 워크플로는 머지를 풀지 못한다 — 2026-08-19 실측.**
# 아래 원문 설계는 「같은 job 이름이면 이전 실행의 빨간 required check 를 갱신한다」고 단언했다.
# 실측은 반대다. body-edit success 를 받은 고유 SHA 18개 중, **같은 SHA 에 빨강이 먼저 있던**
# 6건은 **그 SHA 로 머지된 적이 없다**. 그중 다른 필수 체크가 전부 초록이라 same-name 만이
# 유일한 차단 요인이었던 깨끗한 사례는 `1cbc371b`(#1439) 1건이고, PR #1455 의 실시간 관측
# (같은 이름 초록이 있는 채 `mergeStateStatus=BLOCKED` 20회 연속)이 두 번째다. 반례는 0건.
# 그리고 과거 세션들은 이미 새 SHA 로 우회하고 있었다 — #1434 의 마지막 커밋은
# "본문 수치 축 재발화용 빈 커밋", #1387 은 "본문 갱신 재트리거" 다.
#
# 🔴 **그래도 지우지 않는다.** 이 워크플로는 편집된 본문을 **다시 검증**한다. 머지를 못 푼다는
# 것과 쓸모없다는 것은 다르다 — 지우면 그 재검증이 사라진다(Grok claim-review `01a01a1b`).
# 복구 절차는 `docs/workflow/verify.md` 4번: 새 SHA 다.
#
# 남은 미확정: GitHub 이 **끝내** 수렴하지 않는지, 아니면 관측창이 매번 짧았는지.
# 동일 이름 check-run 이 여럿일 때 branch protection 이 최신 하나를 쓰는지 전부를 요구하는지도
# 문서에 없다(공식 문서는 status context 기준으로만 「최신」을 말한다).
#
# It does NOT clear the earlier red: measured 6/6 non-merges at the same SHA (1 clean case),
# zero counterexamples. Kept because it still re-validates the edited body. Recovery = a new SHA.
#
# 🔴 왜 job 이름이 `ci.yml` 과 **같아야** 하는가 (Grok claim-review `019fbc8e` 의 검증자 적발)
# required status check 는 **(SHA, check 이름)** 으로 식별된다. 다른 이름의 얇은 워크플로가
# 초록이 돼도 이전 실행의 빨간 `Repo integrity guards (stdlib backstop)` 은 **그대로 남아**
# 머지가 계속 막힌다. 반대로 같은 워크플로에서 다른 job 들을 `if` 로 **skip** 시키면, skip 이
# 성공으로 취급돼 **직전에 실패한 required check 를 세탁**할 수 있다(fail-open). 그래서
# 별도 워크플로 + **동일 job 이름** + 다른 check 는 손대지 않음 이 유일하게 안전한 형태다.
# 🔴 위 문단은 **설계 의도**이지 관측이 아니다 — 실측은 이 형태로도 머지가 풀리지 않았다(맨 위).
#
# 🔴 step 목록을 `ci.yml` 의 repo-integrity 와 **동일하게** 유지하는 이유
# 같은 이름의 check 를 갱신하므로, 여기서만 일부 step 을 돌리면 그 check 가 **자기 의미보다
# 적은 것을 검증하고도 초록**이 된다. 형태 가드가 이 동치를 강제한다:
# `tests/unit/scripts/test_claim_review_body_edit_workflow.py`.
#
# Re-runs the repo-integrity check when a PR **body** is edited, because the policy-19
# claim-review guard reads the body. Must share ci.yml's job display name: required checks are
# keyed by (SHA, name), so a differently-named workflow cannot clear the earlier red one, and
# skipping sibling jobs in the same workflow would launder their failures.
name: Claim-review on PR body edit

on:
  pull_request:
    # base 필터 없음 — `ci.yml` 과 같은 이유 (#1432). 이 워크플로는 `ci.yml` 의 repo-integrity
    # check 를 **같은 이름으로 갱신**하므로, 한쪽만 발화 범위를 좁히면 본문을 고쳐도 재평가되지
    # 않는 base 가 생긴다. 두 파일의 발화 범위는 함께 움직여야 한다.
    # No base filter, mirroring ci.yml: this workflow refreshes the *same* check name, so the
    # two must fire on the same set of PRs or body edits stop re-evaluating on some bases.
    types: [edited]

# 최소 권한 — 이 워크플로는 읽기만 한다 (ci.yml 과 동일 원칙).
# Least privilege: read-only, mirroring ci.yml.
permissions:
  contents: read

jobs:
  repo-integrity:
    # 🔴 이 문자열은 `ci.yml` 의 repo-integrity job `name:` 과 **정확히 같아야** 한다.
    #    다르면 required check 를 갱신하지 못하고 새 check 만 하나 더 생긴다.
    # MUST match ci.yml exactly; otherwise this forks a new check instead of updating the required one.
    name: Repo integrity guards (stdlib backstop)
    # 본문이 실제로 바뀐 경우만 — 제목/base 편집으로는 돌지 않는다(비용).
    # Only when the body actually changed; title/base edits do not need this.
    if: github.event.changes.body != null
    runs-on: ubuntu-latest
    steps:
      # 🔴 fetch-depth: 0 필수 — 정책 19 가드가 `git log base..head` 로 PR 범위 커밋 메시지를
      # 읽는다. 얕은 clone 이면 커밋 축이 조용히 빈 문자열로 degrade 된다(ci.yml 과 동일 사유).
      - name: Checkout (full history — 정책 19 가드가 PR 범위 커밋을 읽는다)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # 🔴 충돌 마커는 배지 정합보다 **먼저** — check_docs_sync --fix 가 충돌 블록 안쪽을
      #    고쳐 쓰므로 순서가 뒤바뀌면 깨진 파일 위에서 초록이 난다(ci.yml 과 동일 순서).
      - name: 병합 충돌 마커 차단 (check_conflict_markers)
        run: python scripts/check_conflict_markers.py

      - name: STATE↔README 배지 수치 정합 (check_docs_sync)
        run: python scripts/check_docs_sync.py

      - name: architecture 트리 싱크 (check_architecture_tree_sync)
        run: python scripts/check_architecture_tree_sync.py

      - name: 가드 fail-open floor (check_guard_fail_open)
        run: python scripts/check_guard_fail_open.py

      - name: config.py↔env-vars.md 싱크 (check_env_vars_sync)
        run: python scripts/check_env_vars_sync.py

      - name: RepoConfig 3-layer 싱크 (check_config_5way_sync)
        run: python scripts/check_config_5way_sync.py


      - name: 문서 코드 좌표 = 앵커 (check_doc_anchors)
        run: python scripts/check_doc_anchors.py

      - name: 민감 경로 hold drift (check_sensitive_path_drift)
        run: python scripts/check_sensitive_path_drift.py

      # 🔴 본문을 env 로 넘긴다 — 스크립트가 스스로 `gh pr view` 를 부르던 판은 이 스텝에
      #    `GH_TOKEN` 이 없어(그리고 이 워크플로 권한에 `pull-requests: read` 도 없어)
      #    늘 빈 본문을 받았고, 면제 채널이 영영 매치되지 않았다. 이 워크플로는 `edited` 로
      #    발화하므로 페이로드 본문이 곧 최신값이다(ci.yml 은 rerun 때문에 조회 스텝을 쓴다).
      #    Hand the body in via env; the script's own `gh pr view` could never authenticate here.
      - name: 증거집합 술어의 외부 반례 코퍼스 (check_witness_set_predicates)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python scripts/check_witness_set_predicates.py

      # 🔴 본문은 신뢰할 수 없는 입력 — `run:` 에 보간하지 않고 env 로 전달한다(명령 인젝션 차단).
      # The PR body is untrusted input: pass via env, never interpolate into the shell line.
      # 🔴 이 job 의 step 집합은 `ci.yml` repo-integrity 와 **같아야 한다** — 같은 required check
      #    이름을 쓰므로 갈라지면 "본문만 고쳐 통과" 경로가 생긴다.
      #    가드를 지울 때 두 파일을 같은 커밋에서 고친다.
      - name: 정책 19 — seal 주장 시 claim-review 흔적 강제
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # base 이름 — 고지 전용 (ci.yml 과 동일). 미전달이면 그 배너만 조용히 사라진다.
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          # 🔴 ci.yml 의 같은 이름 step 과 **동일**해야 한다 — 한쪽만 저자 env 를 넘기면
          #    본문 수정 재판정에서 봇이 다시 차단된다(같은 이름 check 가 빨간 채로 남는다).
          # Must stay identical to the ci.yml step; a one-sided env would re-block bots here.
          PR_AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: python scripts/check_claim_review_trace.py
