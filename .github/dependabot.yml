# Dependabot configuration for SCAManager
# 사이클 86 신설 (2026-05-06) — GitHub Auto-Injected `submit-pypi` workflow 영구 timeout 대응:
# 2026-04-23 GitHub Changelog "Dependabot-based dependency graphs for Python" 신규 도입에 따라
# Dependabot 활성 시 Auto-Injected submit-pypi 가 supersede 됨 (관점 4+5 검증).
#
# 정책 정합:
# - 정책 12 (MCP scope): GitHub Settings UI 변경은 사용자 영역. 본 dependabot.yml 신설은 Claude scope.
# - 정책 16 (단순화 default): 단일 ecosystem (pip) + weekly + open-PR 한도 = minimal config.
# - 메모리 `feedback_line_drift_verification.md`: 추측 금지 — 인용은 실측값으로.
#   (이전 판은 feedback-log-first-debugging.md 를 가리켰는데 그 파일은 존재하지 않는다 —
#    감사 B7/#1519 에서 dangling 으로 검출됐다.)
#
# 운영 영향:
# - Python 의존성 보안 알림 (Dependabot security updates) 자동 제공
# - 주간 Dependabot PR 발생 가능 (open-pull-requests-limit 으로 제어)
# - GitHub Dependency Graph 데이터 = Dependabot 기반 자동 갱신 (submit-pypi 폐기 후속)

version: 2
updates:
  # Python 의존성 (requirements.txt + requirements-dev.txt)
  # Python dependencies (Railway 자동 감지 + 개발 환경)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    # PR 누적 차단 — 동시 5개 한도 (운영 부담 ↓)
    # Cap concurrent PRs at 5 to limit operational overhead
    open-pull-requests-limit: 5
    # Security update 우선 — 일반 update 보조
    # Prioritize security updates over feature updates
    labels:
      - "dependencies"
      - "python"
    # 사이클 87 Tier B-2 — production vs development 분리 (회고 관점 1 P1)
    # 효과: minor/patch 일괄 묶음 → conflict 자동 해소 ROI ↑ + 머지 부담 ↓
    # major bump + security update = group 외 개별 PR (변경 로그 검토 의무 페어)
    # Cycle 87 Tier B-2 — split production vs development (retro perspective 1 P1)
    # Effect: minor/patch grouped → fewer conflicts + less merge overhead
    # major bump + security updates = individual PRs (changelog review pair)
    groups:
      production-deps:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-deps:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    # semgrep 보류 명시 (#1227 항목 2 — 2026-07-29 사용자 결정)
    # semgrep 1.171.0+ 는 click~=8.4.2 를 요구하는데 sqlfluff 4.2.2(PyPI 최신)는 click<8.4.0 이라
    # ResolutionImpossible. sqlfluff 를 올려 해소할 수 없고(4.2.2 가 최신이고 그 제약이 최신),
    # 올리려면 sqlfluff 를 버려야 하므로 SQL 정적분석 유지를 우선했다. 핀 자체는 requirements.txt
    # 주석이 단일 출처이며, 여기 규칙은 **반복 제안으로 CI 가 매번 빨개지는 노이즈**만 없앤다.
    #
    # 🔴 해제 조건: sqlfluff 가 click 상한을 완화한 릴리스를 내면 이 ignore 항목을 제거하고
    #    `pip install --dry-run -r requirements.txt -r requirements-dev.txt` 로 해석 성공을 먼저 확인.
    # 🔴 이 ignore 는 dependabot 의 재제안을 **영구히 막는다** — 해제 조건이 충족돼도 아무도
    #    알려주지 않는 silent-disable 클래스다. 추적처는 **GitHub Issues** 다
    #    (`docs/backlog.md` 는 2026-08-16 퇴역).
    #
    # semgrep hold made explicit (#1227 item 2, user decision 2026-07-29). This rule only removes
    # the repeated-proposal noise; the pin itself is owned by the requirements.txt comment.
    # 🔴 It permanently suppresses re-proposals, so the release condition is tracked in backlog.md.
    ignore:
      - dependency-name: "semgrep"
        versions: [">=1.171.0"]

  # npm 의존성 (package.json + package-lock.json — scamanager-ui Tailwind/eslint 빌드 툴체인)
  # npm dependencies (UI build toolchain — all devDependencies, not shipped at runtime)
  # 2026-07-22 회고 P1-④ 사용자 결정: monitor-only (fail-closed CI 게이트 대신 dependabot 감시).
  #   사유 = devDeps·빌드/lint 전용이라 런타임 노출 낮음(정책 17 안정성>규격). pip 축과 대칭
  #   커버리지를 확보하되 빌드 차단 마찰은 만들지 않음. #1169(brace-expansion) 같은 반응형 fix 예방.
  # 2026-07-22 retro P1-④ user decision: monitor-only (dependabot watch instead of a fail-closed CI gate).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    # npm 의존성은 전부 devDependencies (tailwindcss·eslint) — dev 묶음만.
    # All npm deps are devDependencies (tailwindcss·eslint) — group dev minor/patch.
    groups:
      npm-dev:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    # typescript 상한 고정 (#1232 실측 — 2026-07-29)
    # `@typescript-eslint/parser` 8.x 의 peer 범위가 `typescript >=4.8.4 <6.1.0` 이라
    # typescript 7 을 올리면 `npm ci` 가 ERESOLVE 로 **실패**한다(빌드 자체가 깨짐):
    #   npm error peer typescript@">=4.8.4 <6.1.0" from @typescript-eslint/parser@8.65.0
    # 이 파서는 런타임 eslint 분석기(`src/analyzer/configs/*.mjs`)가 .ts/.tsx 를 파싱하는 데
    # 쓰이므로(#1226/#1228), 버리면 TS 정적분석이 다시 무동작이 된다.
    #
    # 🔴 해제 조건: `@typescript-eslint/parser` 가 typescript 7 을 peer 로 받는 버전을 내면
    #    이 항목 제거 후 `npm install` 해석 성공 + `pytest tests/integration/test_eslint_analyzer.py`
    #    (.ts/.tsx 축) 통과를 먼저 확인.
    # 🔴 이 ignore 도 해제 조건 충족을 알려주지 않는다(silent-disable) → GitHub Issues 추적
    #    (구 backlog H4; 원장은 2026-08-16 퇴역).
    #
    # Pin typescript below 6.1 (#1232, measured): @typescript-eslint/parser 8.x peers on
    # `typescript >=4.8.4 <6.1.0`, so bumping to 7 makes `npm ci` fail with ERESOLVE. That parser is
    # what lets the runtime eslint analyzer parse .ts/.tsx (#1226), so dropping it would make TS
    # static analysis dead again.
    ignore:
      - dependency-name: "typescript"
        versions: [">=6.1.0"]

  # GitHub Actions (workflows 의존성)
  # GitHub Actions workflow dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    # 사이클 87 Tier B-2 — github-actions 도 minor/patch 묶음 (major = 개별 검토)
    # Cycle 87 Tier B-2 — github-actions minor/patch grouping (major = individual review)
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
